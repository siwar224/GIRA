name: Package

# Builds the Docker image of a release and publishes it to GitHub Packages
# (ghcr.io/<owner>/gira), tagged with the release version and "latest".
#
# Runs on its own after every release (called from release.yml), or by hand:
# Actions → Package → Run workflow → the release tag (e.g. v1.1.0).
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to package (e.g. v1.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name and label the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gira
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=GIRA — Pasta & Mare
            org.opencontainers.image.description=The GIRA restaurant website: story, plate builder, bookings and La sala.
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 📦 ghcr.io/${{ github.repository_owner }}/gira:${{ inputs.version }}"
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/gira:${{ inputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
